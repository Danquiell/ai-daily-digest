name: AI Daily Digest

# ── Scheduling ────────────────────────────────────────────────────────────────
# Target: 06:00 BRT (UTC-3) = 09:00 UTC
# Note: GitHub's schedule trigger can be delayed 2-3h on free plans.
#
# For reliable 06:00 BRT timing, use cron-job.org (free) to trigger via API:
#   URL:    POST https://api.github.com/repos/Danquiell/ai-daily-digest/actions/workflows/daily_post.yml/dispatches
#   Body:   {"ref":"main"}
#   Header: Authorization: Bearer <GH_TOKEN>
#   Schedule: 0 9 * * * (09:00 UTC daily)
#
# The schedule below runs as fallback if the external trigger is not configured.
# ──────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # Target: 06:00 BRT (= 09:00 UTC). GitHub's docs warn that scheduled workflows
    # are delayed during high load and that "high load times include the start of
    # every hour". We use odd minutes (smaller runner queue) and six attempts in a
    # ~1h45 window. main.py exits cleanly if today is already in history.json, so
    # duplicate firings are safe.
    - cron: "3 9 * * *"     # 06:03 BRT
    - cron: "17 9 * * *"    # 06:17 BRT
    - cron: "33 9 * * *"    # 06:33 BRT
    - cron: "47 9 * * *"    # 06:47 BRT
    - cron: "11 10 * * *"   # 07:11 BRT (fallback)
    - cron: "41 10 * * *"   # 07:41 BRT (fallback)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without posting (dry run)"
        required: false
        default: "false"
        type: boolean

jobs:
  post:
    # Setting the repository variable POSTING_PAUSED to "true" stops the
    # scheduled posts; manual runs (dry runs included) still work.
    if: github.event_name == 'workflow_dispatch' || vars.POSTING_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The built-in GITHUB_TOKEN handles checkout + push back to this repo and
    # never expires. No personal access token (PAT) needed.
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Headless Chromium renders the post images from HTML.
      - name: Install Chromium for the images
        run: python -m playwright install --with-deps chromium

      # The LinkedIn token lasts 60 days and cannot renew itself. The date is
      # written by scripts/linkedin_auth.py; a week before it, open one issue so
      # the warning arrives by e-mail before the posts stop.
      - name: Warn when the LinkedIn token is about to expire
        env:
          GH_TOKEN: ${{ github.token }}
          EXPIRES: ${{ vars.LINKEDIN_TOKEN_EXPIRES_AT }}
        run: |
          if [ -z "$EXPIRES" ]; then echo "No expiry date recorded."; exit 0; fi
          days=$(( ( $(date -d "$EXPIRES" +%s) - $(date +%s) ) / 86400 ))
          echo "LinkedIn token expires on $EXPIRES ($days days)."
          if [ "$days" -le 7 ]; then
            title="LinkedIn token expires on $EXPIRES"
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq 'length')
            if [ "$open" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --body "The daily post stops on that date. Renew the token from the repository root: \`python scripts/linkedin_auth.py --paste\`"
            fi
          fi

      - name: Run AI Daily Digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python src/main.py $FLAGS

      # Images, caption and first comment: what went out, or what a dry run
      # would have posted.
      - name: Upload post preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-post-${{ github.run_id }}
          path: |
            output/*.jpg
            output/caption.txt
            output/first_comment.txt
            output/images.json
          retention-days: 7
          if-no-files-found: ignore
